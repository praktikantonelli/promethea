# .github/workflows/lints.yaml
name: Lints

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # read rust-toolchain.toml file for version
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings
